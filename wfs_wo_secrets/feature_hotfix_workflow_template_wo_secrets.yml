name: Feature/Hotfix CICD Template workflow

on:
  workflow_call:

    secrets:
      CONNECTED_APP_ID:
        required: true
      CONNECTED_APP_SECRET:
        required: true
      GH_SHARED_REPO_PAT:
        required: true
    outputs:
      # Map the workflow output(s) to job output(s)
      reusable_output:
        description: 'Output from the reusable workflow'
        value: ${{ jobs.reusable-workflow-job.outputs.job_output }}
     
jobs:
  feature_hotfix_workflow_template:
    runs-on: self-hosted
    environment: DEV

    env:
      ENV_NAME: DEV
      CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
      CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      # 2. Checkout the shared-repo to get settings.xml
      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: narendar-gaddam_sfemu/shared-runner-templates
          path:  shared # Download shared-repo into this folder
          token: ${{ secrets.GH_SHARED_REPO_PAT }} # Required if shared-repo is private
#          token: ${{ secrets.GITHUB_TOKEN }}

          sparse-checkout: |
            mulesoft/maven
          sparse-checkout-cone-mode: false
      - name: Configure AWS credentials for Secrets Manager
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Fetch secrets from AWS Secrets Manager
        id: aws_secrets
        shell: bash
        env:
          AWS_SECRET_ID: ${{ vars.AWS_SECRETS_MANAGER_SECRET_ID }}
#          AWS_SECRET_ID_MAP: ${{ vars.AWS_SECRETS_MANAGER_SECRET_ID_MAP }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          SECRET_ID="$AWS_SECRET_ID"
          if [ -n "$AWS_SECRET_ID_MAP" ]; then
            SECRET_ID=$(echo "$AWS_SECRET_ID_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          fi
          if [ -z "$SECRET_ID" ] || [ "$SECRET_ID" = "null" ]; then
            echo "AWS Secrets Manager secret id not set; skipping."
            exit 0
          fi
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text --region "${AWS_REGION:-us-east-2}")
          set_secret() {
            local key="$1"
            local value
            value=$(echo "$SECRET_JSON" | jq -r --arg key "$key" '.[$key] // empty')
            if [ -n "$value" ] && [ "$value" != "null" ]; then
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            fi
          }
          set_secret "CONNECTED_APP_ID"
          set_secret "CONNECTED_APP_SECRET"

      - name: BuildPackage
        run: mvn -B -U clean package -DskipASTValidation -DskipTests -s shared/mulesoft/maven/settings.xml 
        env:          
          CONNECTED_APP_ID: ${{ env.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ env.CONNECTED_APP_SECRET }}
