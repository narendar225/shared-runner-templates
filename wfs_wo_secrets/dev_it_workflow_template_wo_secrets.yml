name: DEV/IT CICD Workflow Template

on:
  workflow_call:

    secrets:
      ANYPOINT_MULE_KEY_MAP:
        required: true
      ANYPOINT_PLATFORM_CLIENT_ID_MAP:
        required: true
      CONNECTED_APP_ID:
        required: true
      CONNECTED_APP_SECRET:
        required: true
      GH_SHARED_REPO_PAT:
        required: true
        
    outputs:
      # Map the workflow output(s) to job output(s)
      reusable_output:
        description: 'Output from the reusable workflow'
        value: ${{ jobs.reusable-workflow-job.outputs.job_output }}
     
jobs:
  dev_it_workflow_template:
    runs-on: self-hosted
    environment:
      ${{ endsWith(github.event.pull_request.base.ref, '/dev') && 'Dev' || endsWith(github.event.pull_request.base.ref, '/it') && 'IT' || 'unknown' }}

    env:
      # This expression is evaluated at the job level and the result is stored in the shell variable $ENV_NAME
      ENV_NAME: ${{ endsWith(github.event.pull_request.base.ref, '/dev') && 'DEV' || endsWith(github.event.pull_request.base.ref, '/it') && 'IT' || 'unknown' }}

    # This condition ensures the job only runs if:
    # 1. The PR was merged
    # 2. The PR's target branch is 'release/R*/ dev or it'      
    if: | 
      github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, 'release/') && (endsWith(github.event.pull_request.base.ref, '/dev') || endsWith(github.event.pull_request.base.ref, '/it'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

#Inputs recevied from the workflow call
      - name: Print Input variables
        id: input_variables
        run: | 
          echo "Replica Size is ${{ inputs.REPLICA_SIZE_MAP }}"
          echo "Replica Count is ${{ inputs.REPLICA_COUNT_MAP }}"


      - name: Extract Repository Name
        id: repo
        run: |
          #The ${VAR#*/} syntax removes the shortest match of '*/' from the start of the string.
          REPO_NAME=${GITHUB_REPOSITORY#*/} 
        
          # Set the extracted name as a step output
          echo "Repository Name is $REPO_NAME"
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Get Git POM Version and GROUPID
        id: version
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BUSINESS_GROUP_ORG_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          echo "Business Group Org ID: $BUSINESS_GROUP_ORG_ID and Project Version: $PROJECT_VERSION"
          
          # Make PROJECT_VERSION available to subsequent steps
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "BUSINESS_GROUP_ORG_ID=$BUSINESS_GROUP_ORG_ID" >> $GITHUB_OUTPUT        
          

      - name: Retrieve Variables
        id: mapper
        env:
          ORG_ID: ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }}
          REPLICA_SIZE_IN: ${{ inputs.REPLICA_SIZE_MAP }}
          REPLICA_COUNT_IN: ${{ inputs.REPLICA_COUNT_MAP }}
          CLUSTER_MODE_IN: ${{ inputs.CLUSTER_MODE_MAP }}
          REPLICA_COUNT_MAP: ${{ vars.REPLICA_COUNT_MAP }}
          REPLICA_SIZE_MAP: ${{ vars.REPLICA_SIZE_MAP }}
          DEPLOYMENT_TARGET_MAP: ${{ vars.DEPLOYMENT_TARGET_MAP }}
          AWS_ROLE_ARN_MAP: ${{ vars.AWS_ROLE_ARN_MAP }}
          SPLUNK_INDEX_MAP: ${{ vars.SPLUNK_INDEX_MAP }}
          CLUSTER_MODE_MAP: ${{ vars.CLUSTER_MODE_MAP }}
          ANYPOINT_FWD_SSL_SESSION: ${{ vars.ANYPOINT_FWD_SSL_SESSION }}
          ANYPOINT_LAST_MILE_SECURITY: ${{ vars.ANYPOINT_LAST_MILE_SECURITY }}
          SPLUNK_TOKEN_MAP: ${{ vars.SPLUNK_TOKEN_MAP }}
          ANYPOINT_ENV_MAP: ${{ vars.ANYPOINT_ENV_MAP }}
          ANYPOINT_MULE_KEY_MAP: ${{ secrets.ANYPOINT_MULE_KEY_MAP }}
          ANYPOINT_PLATFORM_CLIENT_ID_MAP: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID_MAP }}
          CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}

        run: |
          DEPLOYMENT_TARGET=$(echo "$DEPLOYMENT_TARGET_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          REPLICA_COUNT=$([[ -n "$REPLICA_COUNT_IN" ]] && echo "$REPLICA_COUNT_IN" || echo "$REPLICA_COUNT_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          REPLICA_SIZE=$([[ -n "$REPLICA_SIZE_IN" ]] && echo "$REPLICA_SIZE_IN" || echo "$REPLICA_SIZE_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          AWS_ROLE_ARN=$(echo "$AWS_ROLE_ARN_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          SPLUNK_INDEX=$(echo "$SPLUNK_INDEX_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')

          #Secure Properties
          SPLUNK_TOKEN=$(echo "$SPLUNK_TOKEN_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          ANYPOINT_ENV=$(echo "$ANYPOINT_ENV_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          ANYPOINT_MULE_KEY=$(echo "$ANYPOINT_MULE_KEY_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[].value')
          ANYPOINT_PLATFORM_ORG_NAME=$(echo "$ANYPOINT_PLATFORM_CLIENT_ID_MAP" | tr -d '\r\n' | jq -r --arg id "$ORG_ID" --arg env "$ENV_NAME" '.[$id + "_" + $env].name')
          ANYPOINT_PLATFORM_CLIENT_ID=$(echo "$ANYPOINT_PLATFORM_CLIENT_ID_MAP" | tr -d '\r\n' | jq -r --arg id "$ORG_ID" --arg env "$ENV_NAME" '.[$id + "_" + $env].client_id')
          ANYPOINT_PLATFORM_CLIENT_SECRET=$(echo "$ANYPOINT_PLATFORM_CLIENT_ID_MAP" | tr -d '\r\n' | jq -r --arg id "$ORG_ID" --arg env "$ENV_NAME" '.[$id + "_" + $env].client_secret')
          
          #Default Properties
          CLUSTER_MODE=$(echo "$CLUSTER_MODE_MAP" | jq -r 'to_entries | map(select(.key | endswith("'"$ENV_NAME"'"))) | .[0].value | if . == "true" then "clustered" else "no-clustered" end')
          ANYPOINT_FWD_SSL_SESSION=$([[ "$ANYPOINT_FWD_SSL_SESSION" == "true" ]] && echo "forwardSslSession" || echo "no-forwardSslSession")
          ANYPOINT_LAST_MILE_SECURITY=$([[ "$ANYPOINT_LAST_MILE_SECURITY" == "true" ]] && echo "lastMileSecurity" || echo "no-lastMileSecurity")
          
          #ADD TO OUTPUT VARIABLES
          echo "DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> $GITHUB_OUTPUT 
          echo "REPLICA_COUNT=$REPLICA_COUNT" >> $GITHUB_OUTPUT 
          echo "REPLICA_SIZE=$REPLICA_SIZE" >> $GITHUB_OUTPUT 
          echo "AWS_ROLE_ARN=$AWS_ROLE_ARN" >> $GITHUB_OUTPUT 
          echo "SPLUNK_INDEX=$SPLUNK_INDEX" >> $GITHUB_OUTPUT 
          echo "CLUSTER_MODE=$CLUSTER_MODE" >> $GITHUB_OUTPUT 
          echo "ANYPOINT_FWD_SSL_SESSION=$ANYPOINT_FWD_SSL_SESSION" >> $GITHUB_OUTPUT 
          echo "ANYPOINT_LAST_MILE_SECURITY=$ANYPOINT_LAST_MILE_SECURITY" >> $GITHUB_OUTPUT 
          echo "SPLUNK_TOKEN=$SPLUNK_TOKEN" >> $GITHUB_OUTPUT 
          echo "ANYPOINT_ENV=$ANYPOINT_ENV" >> $GITHUB_OUTPUT         
          echo "ANYPOINT_MULE_KEY=$ANYPOINT_MULE_KEY" >> $GITHUB_OUTPUT         
          echo "ANYPOINT_PLATFORM_ORG_NAME=$ANYPOINT_PLATFORM_ORG_NAME" >> $GITHUB_OUTPUT         
          echo "ANYPOINT_PLATFORM_CLIENT_ID=$ANYPOINT_PLATFORM_CLIENT_ID" >> $GITHUB_OUTPUT         
          echo "ANYPOINT_PLATFORM_CLIENT_SECRET=$ANYPOINT_PLATFORM_CLIENT_SECRET" >> $GITHUB_OUTPUT    
          echo "CONNECTED_APP_ID=$CONNECTED_APP_ID" >> $GITHUB_OUTPUT    
          echo "CONNECTED_APP_SECRET=$CONNECTED_APP_SECRET" >> $GITHUB_OUTPUT    

      - name: Print Variables
        id: env

        run: | 
          echo "GitHub Pull Request Ref (github.ref): ${{ github.event.pull_request.base.ref }}"
          echo "Environment Name:  $ENV_NAME"
          echo "DEPLOYMENT_TARGET: ${{ steps.mapper.outputs.DEPLOYMENT_TARGET }}"
          echo "Replica SIZE is ${{ steps.mapper.outputs.REPLICA_SIZE }}"
          echo "REPLICA_COUNT: ${{ steps.mapper.outputs.REPLICA_COUNT }}"
          echo "AWS_ROLE_ARN: ${{ steps.mapper.outputs.AWS_ROLE_ARN }}"
          echo "SPLUNK_INDEX: ${{ steps.mapper.outputs.SPLUNK_INDEX }}"
          echo "CLUSTER_MODE: ${{ steps.mapper.outputs.CLUSTER_MODE }}"
          echo "ANYPOINT_ENV: ${{ steps.mapper.outputs.ANYPOINT_ENV }}"          
          echo "SPLUNK_TOKEN: ${{ steps.mapper.outputs.SPLUNK_TOKEN }}"
          echo "ANYPOINT_MULE_KEY: ${{ steps.mapper.outputs.ANYPOINT_MULE_KEY }}"          
          echo "ANYPOINT_PLATFORM_CLIENT_ID: ${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }}"          
          echo "ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }}"          
          echo "ANYPOINT_PLATFORM_ORG_NAME: ${{ steps.mapper.outputs.ANYPOINT_PLATFORM_ORG_NAME }}"      
          echo "CONNECTED_APP_ID: ${{ steps.mapper.outputs.CONNECTED_APP_ID }}"
          echo "CONNECTED_APP_SECRET: ${{ steps.mapper.outputs.CONNECTED_APP_SECRET }}"


      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: narendar-gaddam_sfemu/shared-runner-templates
          path:  shared # Download shared-repo into this folder
          token: ${{ secrets.GH_SHARED_REPO_PAT }} # Required if shared-repo is private
          sparse-checkout: |
            mulesoft/maven
          sparse-checkout-cone-mode: false
          
      - name: Publish to Exchange
        run: mvn -B -U -DskipASTValidation -DskipTests deploy -s shared/mulesoft/maven/settings.xml -DappName=${{ steps.repo.outputs.repo_name }}
        env:          
          CONNECTED_APP_ID: ${{ steps.mapper.outputs.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ steps.mapper.outputs.CONNECTED_APP_SECRET }}
        if: ${{ success() }}

      - name: Install Anypoint CLI on runner
        run: npm install -g anypoint-cli-v4
        if: ${{ success() }}

      - name: Add Anypoint Account Plugin
        run: anypoint-cli-v4 plugins:install anypoint-cli-account-plugin
        if: ${{ success() }}

      - name: Add Runtime Plugin CLI
        run: anypoint-cli-v4 plugins:install anypoint-cli-runtime-mgr-plugin
        if: ${{ success() }}

      - name: Authenticate with Anypoint Platform
        run: |
          anypoint-cli-v4 conf client_id $CONNECTED_APP_ID
          anypoint-cli-v4 conf client_secret $CONNECTED_APP_SECRET
          anypoint-cli-v4 conf organization ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }}
          anypoint-cli-v4 conf environment Sandbox 
          #${{ steps.mapper.outputs.ANYPOINT_ENV }}           
        env:          
          CONNECTED_APP_ID: ${{ steps.mapper.outputs.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ steps.mapper.outputs.CONNECTED_APP_SECRET }}
#          anypoint-cli-v4 conf environment ${{ vars.TARGET_ENV }} 
      #take environment name from github environment
        if: ${{ success() }}
      - name: Validate Anypoint CLI
        run: |
          anypoint-cli-v4 account:environment:list 
        if: ${{ success() }}


      - name: Deploy Mule Application
        run: |
          #The logic to check for the application's existence
          APP_NAME=${{ steps.repo.outputs.repo_name }}
          ENV_NAME=$(echo "${{ env.ENV_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "$ENV_NAME-$APP_NAME"

          APP_ID=$(anypoint-cli-v4 runtime-mgr:application:list --output json | jq -r ".[] | select(.name == \"${ENV_NAME}-${APP_NAME}\") | .id")

          # Check if the APP_ID variable is not empty
          if [ -n "$APP_ID" ]; then
            echo "APP_ID: $APP_ID"
            echo "Application '$ENV_NAME-$APP_NAME' already exists. Redeploying it..."  
            #ECHO MODIFY/REDEPLOY COMMAND
            echo " anypoint-cli-v4 runtime-mgr:application:modify $APP_ID --artifactId $APP_NAME --assetVersion ${{ steps.version.outputs.PROJECT_VERSION }} --groupId ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }} --replicaSize ${{ steps.mapper.outputs.REPLICA_SIZE }} --replicas ${{ steps.mapper.outputs.REPLICA_COUNT }} \
            --${{ steps.mapper.outputs.CLUSTER_MODE }} \
            --${{ steps.mapper.outputs.ANYPOINT_FWD_SSL_SESSION }} \
            --${{ steps.mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }} \
            --property splunk.url:${{ vars.SPLUNK_URL }} \
            --secureProperty mule.key:${{ steps.mapper.outputs.ANYPOINT_MULE_KEY }} \
            --secureProperty anypoint.platform.client_id:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }} \
            --secureProperty anypoint.platform.client_secret:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }} \
            --secureProperty splunk.token:${{ steps.mapper.outputs.SPLUNK_TOKEN }} \
            --property splunk.source:$ENV_NAME-$APP_NAME \
            --property splunk.index:${{ steps.mapper.outputs.SPLUNK_INDEX }} \
            --property mule.env:${{ steps.mapper.outputs.ANYPOINT_ENV }} \
            --property env:$ENV_NAME"

            #Re-Deploy Command
            anypoint-cli-v4 runtime-mgr:application:modify $APP_ID --artifactId $APP_NAME --assetVersion ${{ steps.version.outputs.PROJECT_VERSION }} --groupId ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }} --replicaSize ${{ steps.mapper.outputs.REPLICA_SIZE }} --replicas ${{ steps.mapper.outputs.REPLICA_COUNT }} \
            --${{ steps.mapper.outputs.CLUSTER_MODE }} \
            --${{ steps.mapper.outputs.ANYPOINT_FWD_SSL_SESSION }} \
            --${{ steps.mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }} \
            --property splunk.url:${{ vars.SPLUNK_URL }} \
            --secureProperty mule.key:${{ steps.mapper.outputs.ANYPOINT_MULE_KEY }} \
            --secureProperty anypoint.platform.client_id:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }} \
            --secureProperty anypoint.platform.client_secret:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }} \
            --secureProperty splunk.token:${{ steps.mapper.outputs.SPLUNK_TOKEN }} \
            --property splunk.source:$ENV_NAME-$APP_NAME \
            --property splunk.index:${{ steps.mapper.outputs.SPLUNK_INDEX }} \
            --property mule.env:${{ steps.mapper.outputs.ANYPOINT_ENV }} \
            --property env:$ENV_NAME

          else
            echo "Application '$ENV_NAME-$APP_NAME' not found. Deploying a new application..."

            #ECHO DEPLOY COMMAND
            echo " anypoint-cli-v4 runtime-mgr:application:deploy '$ENV_NAME-$APP_NAME' ${{ steps.mapper.outputs.DEPLOYMENT_TARGET }} ${{ vars.RUNTIME_VERSION }} '$APP_NAME' --assetVersion ${{ steps.version.outputs.PROJECT_VERSION }} --groupId ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }} --replicaSize ${{ steps.mapper.outputs.REPLICA_SIZE }} --replicas ${{ steps.mapper.outputs.REPLICA_COUNT }} --releaseChannel ${{ vars.RELEASE_CHANNEL }} \
            --${{ steps.mapper.outputs.CLUSTER_MODE }} \
            --${{ steps.mapper.outputs.ANYPOINT_FWD_SSL_SESSION }} \
            --${{ steps.mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }} \
            --property splunk.url:${{ vars.SPLUNK_URL }} \
            --secureProperty mule.key:${{ steps.mapper.outputs.ANYPOINT_MULE_KEY }} \
            --secureProperty anypoint.platform.client_id:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }} \
            --secureProperty anypoint.platform.client_secret:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }} \
            --secureProperty splunk.token:${{ steps.mapper.outputs.SPLUNK_TOKEN }} \
            --property splunk.source:$ENV_NAME-$APP_NAME \
            --property splunk.index:${{ steps.mapper.outputs.SPLUNK_INDEX }} \
            --property mule.env:${{ steps.mapper.outputs.ANYPOINT_ENV }} \
            --property env:$ENV_NAME"

            #DEPLOY COMMAND
            anypoint-cli-v4 runtime-mgr:application:deploy $ENV_NAME-$APP_NAME ${{ steps.mapper.outputs.DEPLOYMENT_TARGET }} ${{ vars.RUNTIME_VERSION }} $APP_NAME --assetVersion ${{ steps.version.outputs.PROJECT_VERSION }} --groupId ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }} --replicaSize ${{ steps.mapper.outputs.REPLICA_SIZE }} --replicas ${{ steps.mapper.outputs.REPLICA_COUNT }} --releaseChannel ${{ vars.RELEASE_CHANNEL }} \
            --${{ steps.mapper.outputs.CLUSTER_MODE }} \
            --${{ steps.mapper.outputs.ANYPOINT_FWD_SSL_SESSION }} \
            --${{ steps.mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }} \
            --property splunk.url:${{ vars.SPLUNK_URL }} \
            --secureProperty mule.key:${{ steps.mapper.outputs.ANYPOINT_MULE_KEY }} \
            --secureProperty anypoint.platform.client_id:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }} \
            --secureProperty anypoint.platform.client_secret:${{ steps.mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }} \
            --secureProperty splunk.token:${{ steps.mapper.outputs.SPLUNK_TOKEN }} \
            --property splunk.source:$ENV_NAME-$APP_NAME \
            --property splunk.index:${{ steps.mapper.outputs.SPLUNK_INDEX }} \
            --property mule.env:${{ steps.mapper.outputs.ANYPOINT_ENV }} \
            --property env:$ENV_NAME
          fi
        if: ${{ success() }}