name: Common Mule CICD Workflow Template

on:
  workflow_call:
    inputs:
      env_name:
        description: The environment name input
        type: string
        default: dev

jobs:

  BUILD_VALIDATION:
    runs-on: self-hosted
    environment: ${{ (inputs.env_name == 'feature' || inputs.env_name == 'hotfix') && 'dev' || inputs.env_name }}
    env:
      ENV_NAME: ${{ inputs.env_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_SHARED_ACCESS_TOKEN: ${{ secrets.GH_SHARED_ACCESS_TOKEN }}
      CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
      CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
    if: inputs.env_name == 'feature' || inputs.env_name == 'hotfix'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: narendar-gaddam_sfemu/shared-runner-templates
          path: shared
          token: ${{ secrets.GH_SHARED_ACCESS_TOKEN }}
          sparse-checkout: |
            mulesoft/maven
          sparse-checkout-cone-mode: false

      - name: Build package
        run: mvn -B -U clean package -DskipASTValidation -DskipTests -s shared/mulesoft/maven/settings.xml
        env:
          CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}

  INITIALIZATION:
    runs-on: self-hosted
    needs: BUILD_VALIDATION
    if: |
          always() && needs.build_validation.result == 'skipped' && inputs.env_name != 'feature' && inputs.env_name != 'hotfix'
          
    environment: ${{ inputs.env_name }}
    env:
      ENV_NAME: ${{ inputs.env_name }}
    outputs:
      env_name: ${{ inputs.env_name }}
      environment_name: ${{ inputs.env_name }}
      repo_name: ${{ steps.repo.outputs.repo_name }}
      project_version: ${{ steps.repo.outputs.PROJECT_VERSION }}
      project_artifactid: ${{ steps.repo.outputs.PROJECT_ARTIFACTID }}
      business_group_org_id: ${{ steps.repo.outputs.BUSINESS_GROUP_ORG_ID }}
      anypoint_platform_client_id: ${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }}
      anypoint_platform_client_secret: ${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }}
      aws_role_arn: ${{ steps.vars_mapper.outputs.AWS_ROLE_ARN }}
      splunk_token: ${{ steps.vars_mapper.outputs.SPLUNK_TOKEN }}
      anypoint_mule_key: ${{ steps.vars_mapper.outputs.ANYPOINT_MULE_KEY }}
      cluster_mode: ${{ steps.vars_mapper.outputs.CLUSTER_MODE }}
      deployment_target_ch2: ${{ steps.vars_mapper.outputs.DEPLOYMENT_TARGET_CH2 }}
      replica_count: ${{ steps.vars_mapper.outputs.REPLICA_COUNT }}
      replica_size: ${{ steps.vars_mapper.outputs.REPLICA_SIZE }}
      splunk_index: ${{ steps.vars_mapper.outputs.SPLUNK_INDEX }}
      anypoint_env: ${{ steps.vars_mapper.outputs.ANYPOINT_ENV }}
      vanity_internal_domain: ${{ steps.vars_mapper.outputs.VANITY_INTERNAL_DOMAIN }}
      app_uri_path: ${{ steps.vars_mapper.outputs.APP_URI_PATH }}
      objectstore_v2: ${{ steps.vars_mapper.outputs.OBJECTSTORE_V2 }}
      gh_user_email: ${{ steps.vars_mapper.outputs.GH_USER_EMAIL }}
      gh_user_name: ${{ steps.vars_mapper.outputs.GH_USER_NAME }}
      anypoint_fwd_ssl_session: ${{ steps.vars_mapper.outputs.ANYPOINT_FWD_SSL_SESSION }}
      anypoint_last_mile_security: ${{ steps.vars_mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }}
      splunk_url: ${{ steps.vars_mapper.outputs.SPLUNK_URL }}
      runtime_version: ${{ steps.vars_mapper.outputs.RUNTIME_VERSION }}
      release_channel: ${{ steps.vars_mapper.outputs.RELEASE_CHANNEL }}
      stage_deployment_skip: ${{ steps.vars_mapper.outputs.STAGE_DEPLOYMENT_SKIP }}
      sonar_sources: ${{ steps.vars_mapper.outputs.SONAR_SOURCES }}
      sonar_host_url: ${{ steps.vars_mapper.outputs.SONAR_HOST_URL }}
      sonar_token: ${{ steps.vars_mapper.outputs.SONAR_TOKEN }}
      skip_ch2_deploy: ${{ steps.vars_mapper.outputs.SKIP_CH2_DEPLOY }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get POM Version and GROUPID
        id: repo
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          PROJECT_ARTIFACTID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          BUSINESS_GROUP_ORG_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          if [ "$ENV_NAME" = "preprod" ]; then
            PROJECT_VERSION=$(echo "$PROJECT_VERSION" | sed 's/-SNAPSHOT$//')
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "PROJECT_ARTIFACTID=$PROJECT_ARTIFACTID" >> $GITHUB_OUTPUT
          echo "BUSINESS_GROUP_ORG_ID=$BUSINESS_GROUP_ORG_ID" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT        

      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: narendar-gaddam_sfemu/shared-runner-templates
          path: shared
          token: ${{ secrets.GH_SHARED_ACCESS_TOKEN }}
          sparse-checkout: |
            mulesoft/scripts
          sparse-checkout-cone-mode: false

      - name: Retrieve Variables
        id: vars_mapper
        env:
          ORG_ID: ${{ steps.repo.outputs.BUSINESS_GROUP_ORG_ID }}
          AWS_ROLE_ARN_MAP: ${{ secrets.AWS_ROLE_ARN_MAP }}
          SPLUNK_TOKEN_MAP: ${{ secrets.SPLUNK_TOKEN_MAP }}
          ANYPOINT_MULE_KEY_MAP: ${{ secrets.ANYPOINT_MULE_KEY_MAP }}
          ANYPOINT_PLATFORM_CLIENT_ID_MAP: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID_MAP }}
          ANYPOINT_PLATFORM_CLIENT_SECRET_MAP: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET_MAP }}
          CLUSTER_MODE_MAP: ${{ vars.CLUSTER_MODE_MAP }}
          DEPLOYMENT_TARGET_CH2_MAP: ${{ vars.DEPLOYMENT_TARGET_CH2_MAP }}
          REPLICA_COUNT_MAP: ${{ vars.REPLICA_COUNT_MAP }}
          REPLICA_SIZE_MAP: ${{ vars.REPLICA_SIZE_MAP }}
          SPLUNK_INDEX_MAP: ${{ vars.SPLUNK_INDEX_MAP }}
          ANYPOINT_ENV_MAP: ${{ vars.ANYPOINT_ENV_MAP }}
          VANITY_INTERNAL_DOMAIN_MAP: ${{ vars.VANITY_INTERNAL_DOMAIN_MAP }}
          ENV_NAME: ${{ inputs.env_name }}
          ANYPOINT_FWD_SSL_SESSION: ${{ vars.ANYPOINT_FWD_SSL_SESSION }}
          ANYPOINT_LAST_MILE_SECURITY: ${{ vars.ANYPOINT_LAST_MILE_SECURITY }}
          SPLUNK_URL: ${{ vars.SPLUNK_URL }}
          RUNTIME_VERSION: ${{ vars.RUNTIME_VERSION }}
          RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL }}
          SONAR_SOURCES: ${{ vars.GH_SONAR_SOURCES }}
          SONAR_HOST_URL: ${{ vars.GH_SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.GH_SONAR_USER_TOKEN }}
          STAGE_DEPLOYMENT_SKIP: ${{ vars.STAGE_DEPLOYMENT_SKIP }}
          APP_URI_PATH: ${{ vars.APP_URI_PATH }}
          OBJECTSTORE_V2: ${{ vars.OBJECTSTORE_V2 }}
          GH_USER_EMAIL: ${{ vars.GH_USER_EMAIL }}
          GH_USER_NAME: ${{ vars.GH_USER_NAME }}
          SKIP_CH2_DEPLOY: ${{ vars.SKIP_CH2_DEPLOYMENT }}
        run: | 
          echo "Retrieving variables from shared-runner-templates repository"
          echo "GH_SONAR_USER_TOKEN: ${{ secrets.GH_SONAR_USER_TOKEN }}" | sed 's/./& /g'
          echo "SONAR_TOKEN: $SONAR_TOKEN" | sed 's/./& /g'
          bash shared/mulesoft/scripts/initialization_retrieve_variables.sh
          echo "Variables retrieved successfully"
          echo "SKIP_CH2_DEPLOYMENT: ${{ vars.SKIP_CH2_DEPLOYMENT }}"
          echo "After SKIP_CH2_DEPLOY: $SKIP_CH2_DEPLOY"
          
      # - name: Print Variables
      #   id: print_variables
      #   run: | 
      #     echo "ENV_NAME=$ENV_NAME"
      #     echo "Replica SIZE is ${{ steps.vars_mapper.outputs.REPLICA_SIZE }}"
          
      #     echo "REPLICA_COUNT: ${{ steps.vars_mapper.outputs.REPLICA_COUNT }}"
      #     echo "CLUSTER_MODE: ${{ steps.vars_mapper.outputs.CLUSTER_MODE }}"
      #     echo "ANYPOINT_FWD_SSL_SESSION: ${{ steps.vars_mapper.outputs.ANYPOINT_FWD_SSL_SESSION }}"
      #     echo "ANYPOINT_LAST_MILE_SECURITY: ${{ steps.vars_mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }}"
      #     echo "DEPLOYMENT_TARGET: ${{ steps.vars_mapper.outputs.DEPLOYMENT_TARGET_CH2 }}"
      #     echo "SPLUNK_INDEX: ${{ steps.vars_mapper.outputs.SPLUNK_INDEX }}"
      #     echo "ANYPOINT_ENV: ${{ steps.vars_mapper.outputs.ANYPOINT_ENV }}"
      #     echo "SPLUNK_TOKEN: ${{ steps.vars_mapper.outputs.SPLUNK_TOKEN }}"
      #     echo "ANYPOINT_MULE_KEY: ${{ steps.vars_mapper.outputs.ANYPOINT_MULE_KEY }}"
      #     echo "ANYPOINT_PLATFORM_CLIENT_ID: ${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }}"
      #     echo "ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }}"
      #     echo "RUNTIME_VERSION: ${{ steps.vars_mapper.outputs.RUNTIME_VERSION }}"
      #     echo "RELEASE_CHANNEL: ${{ steps.vars_mapper.outputs.RELEASE_CHANNEL }}"
      #     echo "ANYPOINT_FWD_SSL_SESSION: ${{ steps.vars_mapper.outputs.ANYPOINT_FWD_SSL_SESSION }}"
      #     echo "ANYPOINT_LAST_MILE_SECURITY: ${{ steps.vars_mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }}"
      #     echo "SPLUNK_URL: ${{ steps.vars_mapper.outputs.SPLUNK_URL }}"
      #     echo "VANITY_DOMAIN: ${{ steps.vars_mapper.outputs.VANITY_INTERNAL_DOMAIN }}"


  SONARQUBE_CODE_SCAN:
    needs: INITIALIZATION
    runs-on: self-hosted

    if: |
        always() && needs.initialization.result == 'success' && (inputs.env_name == '2dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Code Scan
        env:
          SONAR_HOST_URL: ${{ needs.initialization.outputs.sonar_host_url }}
          SONAR_PROJECT_KEY: ${{ needs.initialization.outputs.project_artifactid }}
          SONAR_PROJECT_NAME: ${{ needs.initialization.outputs.repo_name }}
          SONAR_SOURCES: ${{ needs.initialization.outputs.sonar_sources }}
          SONAR_TOKEN: ${{ secrets.GH_SONAR_USER_TOKEN }}
        run: |
          echo "SONAR_PROJECT_KEY: $SONAR_PROJECT_KEY"
          echo "SONAR_PROJECT_NAME: $SONAR_PROJECT_NAME"
          echo "SONAR_HOST_URL: $SONAR_HOST_URL"
          echo "SONAR_TOKEN: $SONAR_TOKEN"
          echo "SONAR_SOURCES: $SONAR_SOURCES"
          
          mvn clean verify sonar:sonar -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.projectName=$SONAR_PROJECT_NAME -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.sources=$SONAR_SOURCES -Dsonar.test=src/test

  PUBLISH_TO_EXCHANGE:
    needs: [INITIALIZATION]
    runs-on: self-hosted
    if: |
        always() && needs.initialization.result == 'success' && (inputs.env_name == 'dev')
    #environment: ${{ inputs.env_name }}
    env:
      ENV_NAME: ${{ inputs.env_name }}
      CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
      CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
      GH_SHARED_ACCESS_TOKEN: ${{ secrets.GH_SHARED_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.GITHUB_TOKEN }}

      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: narendar-gaddam_sfemu/shared-runner-templates
          path: shared
          token: ${{ env.GH_SHARED_ACCESS_TOKEN }}
          sparse-checkout: |
            mulesoft/maven
          sparse-checkout-cone-mode: false
      - name: Print SKIP_CH2_DEPLOY
        run: |
          echo "SKIP_CH2_DEPLOY INITIALIZATION: ${{ needs.initialization.outputs.skip_ch2_deploy }}"
          echo "SKIP_CH2_DEPLOY ASSIGNMENT: $SKIP_CH2_DEPLOY"
        env:
          SKIP_CH2_DEPLOY: ${{ needs.initialization.outputs.skip_ch2_deploy }}
      # - name: Publish to Exchange
      #   run: mvn -B -U -DskipASTValidation -DskipTests deploy -s shared/mulesoft/maven/settings.xml -DappName=${{ needs.initialization.outputs.repo_name }} 
      #   env:
      #     CONNECTED_APP_ID: ${{ env.CONNECTED_APP_ID }}
      #     CONNECTED_APP_SECRET: ${{ env.CONNECTED_APP_SECRET }}

  PERFORM_RELEASE_PUBLISH:
    runs-on: self-hosted
    needs: INITIALIZATION
    if: |
        always() && needs.initialization.result == 'success' && inputs.env_name == 'preprod'     
    #environment: ${{ inputs.env_name }}
    env:
      ENV_NAME: ${{ inputs.env_name }}
      CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
      CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
      PROJECT_VERSION: ${{ needs.initialization.outputs.project_version }}
      GH_USER_EMAIL: ${{ needs.initialization.outputs.gh_user_email }}
      GH_USER_NAME: ${{ needs.initialization.outputs.gh_user_name }}
      GH_REPOSITORY_ACCESS_TOKEN: ${{ secrets.GH_REPOSITORY_ACCESS_TOKEN }}

    outputs:
      release_tag: ${{ steps.extract_tag.outputs.RELEASE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: narendar-gaddam_sfemu/shared-runner-templates
          path: shared
          token: ${{ secrets.GH_SHARED_ACCESS_TOKEN }}
          sparse-checkout: |
            mulesoft/maven
          sparse-checkout-cone-mode: false

      - name: Prepare the release
        run: |
          RELEASE_TAG_VERSION=$(echo "${GITHUB_REF_NAME#release/}" | cut -d'/' -f1)
          git config --global user.email "$GH_USER_EMAIL"
          git config --global user.name "$GH_USER_NAME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch
          git pull
          mvn -Dusername="$GH_USER_NAME" -Dpassword="$GH_REPOSITORY_ACCESS_TOKEN" --batch-mode release:prepare -Dresume=false -DskipASTValidation -DskipTests -Dmaven.test.skip=true -s shared/mulesoft/maven/settings.xml -Dtag=$RELEASE_TAG_VERSION-$PROJECT_VERSION
        env:
          CONNECTED_APP_ID: ${{ env.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ env.CONNECTED_APP_SECRET }}

      - name: Copy Release Properties
        id: extract_tag
        run: |
          RELEASE_TAG=$(grep "scm.tag=" release.properties | cut -d'=' -f2 | tr -d '\r')
          if [ -z "$RELEASE_TAG" ]; then
            echo "Could not find release tag in release.properties."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
          if [ -f release.properties ]; then
            mkdir -p .release && cp release.properties .release/properties
          fi

      - name: Commit and Push Release Properties
        run: |
          git add .release/properties
          git commit -m "chore(release): Add .release/properties from release properties"
          git push

      - name: Perform the release
        run: mvn release:perform -Dmaven.test.skipTests=true -Dmaven.test.skip=true -s shared/mulesoft/maven/settings.xml
        env:
          CONNECTED_APP_ID: ${{ env.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ env.CONNECTED_APP_SECRET }}

  BASELINE_VERSION:
    runs-on: self-hosted
 
    needs: [INITIALIZATION , PERFORM_RELEASE_PUBLISH]
    if: |
        always() && needs.initialization.result == 'success' && (inputs.env_name == 'stage' || inputs.env_name == 'prod')    
    env:
      ENV_NAME: ${{ inputs.env_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.perform_release_publish.outputs.release_tag }}
    outputs:
      baseline_tag_version: ${{ steps.release_tag_version.outputs.RELEASE_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release Version
        id: release_tag_version
        run: |
          RELEASE_TAG=$(grep 'scm.tag=' .release/properties)

          RELEASE_VERSION=${RELEASE_TAG#*-}

          echo "RELEASE_VERSION: $RELEASE_VERSION"

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_OUTPUT

  DEPLOY_TO_RUNTIME_MANAGER:
    needs: [INITIALIZATION, PUBLISH_TO_EXCHANGE, PERFORM_RELEASE_PUBLISH, BASELINE_VERSION]
    if: |
        always() && needs.initialization.result == 'success' && needs.initialization.outputs.skip_ch2_deploy == 'false' && 
        (inputs.env_name != 'feature' && inputs.env_name != 'hotfix') && 
        (needs.publish_to_exchange.result == 'success' || needs.publish_to_exchange.result == 'skipped') && 
        (needs.perform_release_publish.result == 'success' || needs.perform_release_publish.result == 'skipped') &&
        (needs.baseline_version.result == 'success' || needs.baseline_version.result == 'skipped')    
    runs-on: self-hosted
    steps:
      # # - name: Install Node.js
      # #   uses: actions/setup-node@v4
      # #   with:
      # #     node-version: '24'
          
      # # - name: Install Anypoint CLI on runner
      # #   run: npm install -g anypoint-cli-v4
      # #   if: ${{ success() }}

      # # - name: Add Anypoint Account Plugin
      # #   run: anypoint-cli-v4 plugins:install anypoint-cli-account-plugin > /dev/null 2>&1
      # #   if: ${{ success() }}

      # # - name: Add Runtime Plugin CLI
      # #   run: |
      # #     anypoint-cli-v4 plugins:install anypoint-cli-runtime-mgr-plugin > /dev/null 2>&1

      #   if: ${{ success() }}

      - name: Authenticate with Anypoint Platform
        env:
          CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
          BUSINESS_GROUP_ORG_ID: ${{ needs.initialization.outputs.business_group_org_id }}
          ANYPOINT_ENV: Sandbox #${{ needs.initialization.outputs.anypoint_env }}    
          skip_ch2_deploy: ${{ needs.initialization.outputs.skip_ch2_deploy }}
        run: |
          anypoint-cli-v4 conf client_id $CONNECTED_APP_ID
          anypoint-cli-v4 conf client_secret $CONNECTED_APP_SECRET
          anypoint-cli-v4 conf organization $BUSINESS_GROUP_ORG_ID
          anypoint-cli-v4 conf environment Sandbox #$ANYPOINT_ENV
          echo "Successfull Authentication to Anypoint Platform "
          echo "SKIP_CH2_DEPLOY: $skip_ch2_deploy"

        if: ${{ success() }}

      - name: Validate Anypoint CLI
        run: | 
          anypoint-cli-v4 account:environment:list
          anypoint-cli-v4 runtime-mgr:application:list --environment "Sandbox" --output json
        if: ${{ success() }}

        
      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: narendar-gaddam_sfemu/shared-runner-templates
          path: shared
          token: ${{ secrets.GH_SHARED_ACCESS_TOKEN }}
          sparse-checkout: |
            mulesoft/scripts
          sparse-checkout-cone-mode: false      


      - name: Deploy or Update Mule Application
        env:
          ENV_NAME: ${{ needs.initialization.outputs.env_name }}
          REPO_NAME: ${{ needs.initialization.outputs.repo_name }}
          PROJECT_VERSION: ${{ needs.initialization.outputs.project_version }}
          PROJECT_ARTIFACTID: ${{ needs.initialization.outputs.project_artifactid }}
          BUSINESS_GROUP_ORG_ID: ${{ needs.initialization.outputs.business_group_org_id }}
          ANYPOINT_ENV: ${{ needs.initialization.outputs.anypoint_env }}
          ANYPOINT_MULE_KEY: ${{ needs.initialization.outputs.anypoint_mule_key }}
          ANYPOINT_PLATFORM_CLIENT_ID: ${{ needs.initialization.outputs.anypoint_platform_client_id }}
          ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ needs.initialization.outputs.anypoint_platform_client_secret }}
          SPLUNK_TOKEN: ${{ needs.initialization.outputs.splunk_token }}
          SPLUNK_URL: ${{ needs.initialization.outputs.splunk_url }}
          SPLUNK_INDEX: ${{ needs.initialization.outputs.splunk_index }}
          DEPLOYMENT_TARGET_CH2: ${{ needs.initialization.outputs.deployment_target_ch2 }}
          RUNTIME_VERSION: ${{ needs.initialization.outputs.runtime_version }}
          RELEASE_CHANNEL: ${{ needs.initialization.outputs.release_channel }}
          REPLICA_SIZE: ${{ needs.initialization.outputs.replica_size }}
          REPLICA_COUNT: ${{ needs.initialization.outputs.replica_count }}
          CLUSTER_MODE: ${{ needs.initialization.outputs.cluster_mode }}
          ANYPOINT_FWD_SSL_SESSION: ${{ needs.initialization.outputs.anypoint_fwd_ssl_session }}
          ANYPOINT_LAST_MILE_SECURITY: ${{ needs.initialization.outputs.anypoint_last_mile_security }}
          VANITY_INTERNAL_DOMAIN: ${{ needs.initialization.outputs.vanity_internal_domain }}
          APP_URI_PATH: ${{ needs.initialization.outputs.app_uri_path }}
          OBJECTSTORE_V2: ${{ needs.initialization.outputs.objectstore_v2 }}
          RELEASE_TAG: ${{ needs.perform_release_publish.outputs.release_tag }}
          BASELINE_TAG: ${{ needs.baseline_version.outputs.baseline_tag_version }}

          #Execute deployment script
        run: bash -x shared/mulesoft/scripts/deploy_runtime_manager_deploy.sh