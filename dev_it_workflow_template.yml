name: DEV/IT CICD Workflow Template

on:
  workflow_call:
     
jobs:
  dev_it_workflow_template:
    runs-on: [self-hosted, mulesoft]
#    container:
#      image: 658128351367.dkr.ecr.us-east-1.amazonaws.com/mulesoft-builder:latest
      # This mounts the persistent .m2 volume from the host
#      options: --user root -v /home/ssm-user/.m2:/root/.m2
    environment:
      ${{ endsWith(github.event.pull_request.base.ref, '/dev') && 'Dev' || endsWith(github.event.pull_request.base.ref, '/it') && 'IT' || 'unknown' }}
 

    env:
        # This expression is evaluated at the job level and the result is stored in the shell variable $ENV_NAME
        ENV_NAME: ${{ endsWith(github.event.pull_request.base.ref, '/dev') && 'dev' || endsWith(github.event.pull_request.base.ref, '/it') && 'it' || 'unknown' }}
  
      # This condition ensures the job only runs if:
      # 1. The PR was merged
      # 2. The PR's target branch is 'release/R*/ dev or it'      
    if: | 
        github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, 'release/') && (endsWith(github.event.pull_request.base.ref, '/dev') || endsWith(github.event.pull_request.base.ref, '/it'))
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Extract Repository Name
        id: repo
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/} 
          
          # Set the extracted name as a step output
          # echo "Repository Name is $REPO_NAME"
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Get POM Version and GROUPID
        id: version
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BUSINESS_GROUP_ORG_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          echo "Business Group Org ID: $BUSINESS_GROUP_ORG_ID and Project Version: $PROJECT_VERSION"
          
          # Make PROJECT_VERSION available to subsequent steps
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "BUSINESS_GROUP_ORG_ID=$BUSINESS_GROUP_ORG_ID" >> $GITHUB_OUTPUT 


      - name: Retrieve Variables
        id: vars_mapper
        env:
          ORG_ID: ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }}
          AWS_ROLE_ARN_MAP: ${{ secrets.AWS_ROLE_ARN_MAP }}
          SPLUNK_TOKEN_MAP: ${{ secrets.SPLUNK_TOKEN_MAP }}
          ANYPOINT_MULE_KEY_MAP: ${{ secrets.ANYPOINT_MULE_KEY_MAP }}
          ANYPOINT_PLATFORM_CLIENT_ID_MAP: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID_MAP }}
          ANYPOINT_PLATFORM_CLIENT_SECRET_MAP: ${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET_MAP }}
          CLUSTER_MODE_MAP: ${{ vars.CLUSTER_MODE_MAP }}
          DEPLOYMENT_TARGET_CH2_MAP: ${{ vars.DEPLOYMENT_TARGET_CH2_MAP }}
          REPLICA_COUNT_MAP: ${{ vars.REPLICA_COUNT_MAP }}
          REPLICA_SIZE_MAP: ${{ vars.REPLICA_SIZE_MAP }}
          SPLUNK_INDEX_MAP: ${{ vars.SPLUNK_INDEX_MAP }}
          ANYPOINT_ENV_MAP: ${{ vars.ANYPOINT_ENV_MAP }}
          VANITY_INTERNAL_DOMAIN_MAP: ${{ vars.VANITY_INTERNAL_DOMAIN_MAP }}
        run: |
          ANYPOINT_PLATFORM_CLIENT_ID=$(echo "$ANYPOINT_PLATFORM_CLIENT_ID_MAP" | tr -d '\r\n' | jq -r --arg id "$ORG_ID" --arg env "$ENV_NAME" '.[$id][$env]')
          ANYPOINT_PLATFORM_CLIENT_SECRET=$(echo "$ANYPOINT_PLATFORM_CLIENT_SECRET_MAP" | tr -d '\r\n' | jq -r --arg id "$ORG_ID" --arg env "$ENV_NAME" '.[$id][$env]')          
          AWS_ROLE_ARN=$(echo "$AWS_ROLE_ARN_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')
          SPLUNK_TOKEN=$(echo "$SPLUNK_TOKEN_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')
          ANYPOINT_MULE_KEY=$(echo "$ANYPOINT_MULE_KEY_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')
          CLUSTER_MODE=$(echo "$CLUSTER_MODE_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')
          DEPLOYMENT_TARGET_CH2=$(echo "$DEPLOYMENT_TARGET_CH2_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')
          REPLICA_COUNT=$(echo "$REPLICA_COUNT_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')
          REPLICA_SIZE=$(echo "$REPLICA_SIZE_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')
          SPLUNK_INDEX=$(echo "$SPLUNK_INDEX_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')          
          ANYPOINT_ENV=$(echo "$ANYPOINT_ENV_MAP" | tr -d '\r\n' | jq -r --arg id "$ORG_ID" --arg env "$ENV_NAME" '.[$id][$env]')
          VANITY_INTERNAL_DOMAIN=$(echo "$VANITY_INTERNAL_DOMAIN_MAP" | jq -r 'to_entries | map(select(.key == "'"$ENV_NAME"'")) | .[].value')

          #ADDING MAP VARIABLES TO GITHUB OUTPUT
          echo "ANYPOINT_PLATFORM_CLIENT_ID=$ANYPOINT_PLATFORM_CLIENT_ID" >> $GITHUB_OUTPUT 
          echo "ANYPOINT_PLATFORM_CLIENT_SECRET=$ANYPOINT_PLATFORM_CLIENT_SECRET" >> $GITHUB_OUTPUT 
          echo "AWS_ROLE_ARN=$AWS_ROLE_ARN" >> $GITHUB_OUTPUT 
          echo "SPLUNK_TOKEN=$SPLUNK_TOKEN" >> $GITHUB_OUTPUT 
          echo "ANYPOINT_MULE_KEY=$ANYPOINT_MULE_KEY" >> $GITHUB_OUTPUT
          echo "CLUSTER_MODE=$CLUSTER_MODE" >> $GITHUB_OUTPUT
          echo "DEPLOYMENT_TARGET_CH2=$DEPLOYMENT_TARGET_CH2" >> $GITHUB_OUTPUT
          echo "REPLICA_COUNT=$REPLICA_COUNT" >> $GITHUB_OUTPUT
          echo "REPLICA_SIZE=$REPLICA_SIZE" >> $GITHUB_OUTPUT
          echo "SPLUNK_INDEX=$SPLUNK_INDEX" >> $GITHUB_OUTPUT
          echo "ANYPOINT_ENV=$ANYPOINT_ENV" >> $GITHUB_OUTPUT 
          echo "VANITY_INTERNAL_DOMAIN=$VANITY_INTERNAL_DOMAIN" >> $GITHUB_OUTPUT

          #ADD Variables to GITHUB OUTPUT
          echo "ANYPOINT_FWD_SSL_SESSION=${{ vars.ANYPOINT_FWD_SSL_SESSION }}" >> $GITHUB_OUTPUT
          echo "ANYPOINT_LAST_MILE_SECURITY=${{ vars.ANYPOINT_LAST_MILE_SECURITY }}" >> $GITHUB_OUTPUT
          echo "SPLUNK_URL=${{ vars.SPLUNK_URL }}" >> $GITHUB_OUTPUT
          echo "RUNTIME_VERSION=${{ vars.RUNTIME_VERSION }}" >> $GITHUB_OUTPUT
          echo "RELEASE_CHANNEL=${{ vars.RELEASE_CHANNEL }}" >> $GITHUB_OUTPUT
          echo "STAGE_DEPLOYMENT_SKIP=${{ vars.STAGE_DEPLOYMENT_SKIP }}" >> $GITHUB_OUTPUT

      - name: Print Variables
        id: print_variables

        run: | 
          echo "Replica SIZE is ${{ steps.vars_mapper.outputs.REPLICA_SIZE }}"
          echo "REPLICA_COUNT: ${{ steps.vars_mapper.outputs.REPLICA_COUNT }}"
          echo "CLUSTER_MODE: ${{ steps.vars_mapper.outputs.CLUSTER_MODE }}"
          echo "ANYPOINT_FWD_SSL_SESSION: ${{ steps.vars_mapper.outputs.ANYPOINT_FWD_SSL_SESSION }}"
          echo "ANYPOINT_LAST_MILE_SECURITY: ${{ steps.vars_mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }}"
          
          echo "DEPLOYMENT_TARGET: ${{ steps.vars_mapper.outputs.DEPLOYMENT_TARGET_CH2 }}"
          echo "SPLUNK_INDEX: ${{ steps.vars_mapper.outputs.SPLUNK_INDEX }}"
          echo "ANYPOINT_ENV: ${{ steps.vars_mapper.outputs.ANYPOINT_ENV }}"          
          echo "SPLUNK_TOKEN: ${{ steps.vars_mapper.outputs.SPLUNK_TOKEN }}"
          echo "ANYPOINT_MULE_KEY: ${{ steps.vars_mapper.outputs.ANYPOINT_MULE_KEY }}"          
          echo "ANYPOINT_PLATFORM_CLIENT_ID: ${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }}"          
          echo "ANYPOINT_PLATFORM_CLIENT_SECRET: ${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }}"
          echo "RUNTIME_VERSION: ${{ steps.vars_mapper.outputs.RUNTIME_VERSION }}"          
          echo "RELEASE_CHANNEL: ${{ steps.vars_mapper.outputs.RELEASE_CHANNEL }}"
          echo "ANYPOINT_FWD_SSL_SESSION: ${{ steps.vars_mapper.outputs.ANYPOINT_FWD_SSL_SESSION }}"
          echo "ANYPOINT_LAST_MILE_SECURITY: ${{ steps.vars_mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }}"
          echo "SPLUNK_URL: ${{ steps.vars_mapper.outputs.SPLUNK_URL }}"
          echo "VANITY_DOMAIN: ${{ steps.vars_mapper.outputs.VANITY_INTERNAL_DOMAIN }}"

      - name: Checkout Shared-Runner-Templates Repository
        uses: actions/checkout@v4
        with:
          repository: GADCH-Dev/shared-runner-templates
          path:  shared # Download shared-repo into this folder
          token: ${{ secrets.GH_SHARED_ACCESS_TOKEN }} # Required if shared-repo is private
          sparse-checkout: |
            mulesoft/maven
          sparse-checkout-cone-mode: false
          
      - name: Publish to Exchange
        run: mvn -B -U -DskipASTValidation -DskipTests deploy -s shared/mulesoft/maven/settings.xml -DappName=${{ steps.repo.outputs.repo_name }}
        env:          
          CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
        if: ${{ success() }}

      - name: Install Anypoint CLI on runner
        run: npm install -g anypoint-cli-v4
        if: ${{ success() }}

      - name: Add Anypoint Account Plugin
        run: anypoint-cli-v4 plugins:install anypoint-cli-account-plugin
        if: ${{ success() }}

      - name: Add Runtime Plugin CLI
        run: anypoint-cli-v4 plugins:install anypoint-cli-runtime-mgr-plugin
        if: ${{ success() }}

      - name: Authenticate with Anypoint Platform
        run: |
          anypoint-cli-v4 conf client_id $CONNECTED_APP_ID
          anypoint-cli-v4 conf client_secret $CONNECTED_APP_SECRET
          anypoint-cli-v4 conf organization ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }}
          anypoint-cli-v4 conf environment $ANYPOINT_ENV          
        env:          
          CONNECTED_APP_ID: ${{ secrets.CONNECTED_APP_ID }}
          CONNECTED_APP_SECRET: ${{ secrets.CONNECTED_APP_SECRET }}
          ANYPOINT_ENV: ${{ steps.vars_mapper.outputs.ANYPOINT_ENV }} 
        if: ${{ success() }}
      - name: Validate Anypoint CLI
        run: |
          anypoint-cli-v4 account:environment:list 
        if: ${{ success() }}


      - name: Deploy Mule Application
        run: |
          #The logic to check for the application's existence
          APP_NAME=${{ steps.repo.outputs.repo_name }}
          #PUBLIC_ENDPOINTS="https://dev-internal.api.gamest.local" 
          PUBLIC_ENDPOINTS=${{ steps.vars_mapper.outputs.VANITY_INTERNAL_DOMAIN }} 
          ENV_NAME=$(echo "${{ steps.vars_mapper.outputs.ANYPOINT_ENV }}" | tr '[:upper:]' '[:lower:]')
          TARGET_APP_NAME=$ENV_NAME-$APP_NAME
          echo "$TARGET_APP_NAME"

          APP_URL_PATH=$( [ -n "${{ vars.APP_URI_PATH }}" ] && echo "${{ vars.APP_URI_PATH }}" || echo "/${TARGET_APP_NAME}" )

          echo "APP_URL_PATH: $APP_URL_PATH"
          echo "VANITY_INTERNAL_DOMAIN: $VANITY_INTERNAL_DOMAIN"

          PUBLIC_ENDPOINTS=${PUBLIC_ENDPOINTS}${APP_URL_PATH}
          echo "public endpoint: $PUBLIC_ENDPOINTS"

          APP_ID=$(anypoint-cli-v4 runtime-mgr:application:list --output json | jq -r ".[] | select(.name == \"${TARGET_APP_NAME}\") | .id")

          # Check if the APP_ID variable is not empty
          if [ -n "$APP_ID" ]; then
            echo "APP_ID: $APP_ID"
            echo "Application '$TARGET_APP_NAME' already exists. Redeploying to ${{ steps.vars_mapper.outputs.ANYPOINT_ENV }} environment..."  
            #MODIFY/REDEPLOY COMMAND
            anypoint-cli-v4 runtime-mgr:application:modify $APP_ID --artifactId $APP_NAME --assetVersion ${{ steps.version.outputs.PROJECT_VERSION }} --groupId ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }} --replicaSize ${{ steps.vars_mapper.outputs.REPLICA_SIZE }} --replicas ${{ steps.vars_mapper.outputs.REPLICA_COUNT }} \
            --${{ steps.vars_mapper.outputs.CLUSTER_MODE }} \
            --${{ steps.vars_mapper.outputs.ANYPOINT_FWD_SSL_SESSION }} \
            --${{ steps.vars_mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }} \
            --publicEndpoints $PUBLIC_ENDPOINTS \
            --secureProperty mule.key:${{ steps.vars_mapper.outputs.ANYPOINT_MULE_KEY }} \
            --secureProperty anypoint.platform.client_id:${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }} \
            --secureProperty anypoint.platform.client_secret:${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }} \
            --secureProperty splunk.token:${{ steps.vars_mapper.outputs.SPLUNK_TOKEN }} \
            --property splunk.url:${{ steps.vars_mapper.outputs.SPLUNK_URL }} \
            --property splunk.source:$TARGET_APP_NAME \
            --property splunk.index:${{ steps.vars_mapper.outputs.SPLUNK_INDEX }} \
            --property mule.env:$ENV_NAME \
            --property env:$ENV_NAME

          else
            echo "Application '$TARGET_APP_NAME' not found. Deploying a new application to ${{ steps.vars_mapper.outputs.ANYPOINT_ENV }} environment..."
            #DEPLOY COMMAND
            anypoint-cli-v4 runtime-mgr:application:deploy $TARGET_APP_NAME ${{ steps.vars_mapper.outputs.DEPLOYMENT_TARGET_CH2 }} ${{ steps.vars_mapper.outputs.RUNTIME_VERSION }} $APP_NAME --assetVersion ${{ steps.version.outputs.PROJECT_VERSION }} --groupId ${{ steps.version.outputs.BUSINESS_GROUP_ORG_ID }} --replicaSize ${{ steps.vars_mapper.outputs.REPLICA_SIZE }} --replicas ${{ steps.vars_mapper.outputs.REPLICA_COUNT }} --releaseChannel ${{ steps.vars_mapper.outputs.RELEASE_CHANNEL }} \
            --${{ steps.vars_mapper.outputs.CLUSTER_MODE }} \
            --${{ steps.vars_mapper.outputs.ANYPOINT_FWD_SSL_SESSION }} \
            --${{ steps.vars_mapper.outputs.ANYPOINT_LAST_MILE_SECURITY }} \
            --publicEndpoints $PUBLIC_ENDPOINTS \
            --secureProperty mule.key:${{ steps.vars_mapper.outputs.ANYPOINT_MULE_KEY }} \
            --secureProperty anypoint.platform.client_id:${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_ID }} \
            --secureProperty anypoint.platform.client_secret:${{ steps.vars_mapper.outputs.ANYPOINT_PLATFORM_CLIENT_SECRET }} \
            --secureProperty splunk.token:${{ steps.vars_mapper.outputs.SPLUNK_TOKEN }} \
            --property splunk.url:${{ steps.vars_mapper.outputs.SPLUNK_URL }} \
            --property splunk.source:$TARGET_APP_NAME \
            --property splunk.index:${{ steps.vars_mapper.outputs.SPLUNK_INDEX }} \
            --property mule.env:$ENV_NAME \
            --property env:$ENV_NAME
          fi
        if: ${{ success() }}